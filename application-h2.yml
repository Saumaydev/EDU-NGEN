spring:
  application:
    name: EDU-NGEN

  # H2 Database Configuration (No PostgreSQL needed!)
  datasource:
    url: jdbc:h2:mem:edugen_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # H2 Console Configuration (Web interface)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # JPA Configuration for H2
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Mail Configuration (keep same)
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: SG.xxxxx
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: your-super-secret-key-must-be-at-least-32-characters-long-for-hs256
  expiration: 3600000
  refresh:
    expiration: 604800000

# Application Configuration
app:
  name: EDU-NGEN
  base-url: http://localhost:8080
  frontend-url: http://localhost:3000
  email:
    from: noreply@edu-ngen.com
    support: support@edu-ngen.com
  file:
    upload-dir: ./uploads/reports
    max-size-mb: 10
  security:
    cors:
      allowed-origins: http://localhost:3000

# Logging Configuration
logging:
  level:
    root: INFO
    com.edugen: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Springdoc OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs