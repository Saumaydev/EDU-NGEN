spring:
  application:
    name: EDU-NGEN

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/edu_ngen
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    timeout: 60000ms
    password: ""

  # Mail Configuration
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: SG.xxxxx
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: your-super-secret-key-must-be-at-least-32-characters-long-for-hs256
  expiration: 3600000
  refresh:
    expiration: 604800000

# Application Configuration
app:
  name: EDU-NGEN
  base-url: http://localhost:8080
  frontend-url: http://localhost:3000
  email:
    from: noreply@edu-ngen.com
    support: support@edu-ngen.com
  file:
    upload-dir: /uploads/reports
    max-size-mb: 10
  security:
    cors:
      allowed-origins: http://localhost:3000
    ip-whitelist:
      enabled: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.edugen: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Springdoc OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
